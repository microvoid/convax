# Install over a base-backed Web or Desktop profile; native UI rows stay enabled.
- id: agent-preset-registry
  config:
    default: ptc

- id: permission
  config:
    defaultPreset: workspace-write
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never

- id: ui-sidebar-browser
  disabled: false

- insert:
    - id: convax-host
      name: '@deepseek-ai/dsh-convax-plugin-host'
      config:
        databasePath: !!js dshHomePath('storages', 'convax-canvas.sqlite')
        legacyDatabasePath: !!js dshHomePath('storages', 'convax.sqlite')
    - id: convax-renderer
      name: '@deepseek-ai/dsh-convax-plugin-renderer'
    - id: convax-inernal-nodes-host
      name: '@deepseek-ai/dsh-convax-plugin-inernal-nodes-host'
    - id: convax-inernal-nodes-renderer
      name: '@deepseek-ai/dsh-convax-plugin-inernal-nodes-renderer'
