name: Convax CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convax-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  ASTRO_TELEMETRY_DISABLED: '1'
  DSH_SNAPSHOT: replay
  DSH_GATE_CONCURRENCY: '2'
  DSH_OXLINT_THREADS: '2'

jobs:
  linux:
    name: Build, lint, and canvas behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build artifacts and check repository types
        run: pnpm run build
      - name: Lint
        run: pnpm run lint
      - name: Check Convax internationalization
        run: pnpm run check:i18n
      - name: Test the internationalization gate
        run: |
          pnpm exec tsc --project scripts/tsconfig.i18n.json
          pnpm exec vitest run --config scripts/vitest.i18n.config.ts
      - name: Test documentation routing and media
        run: pnpm --filter @convax/docs test
      - name: Check documentation content and types
        run: pnpm run check:docs
      - name: Test canvas Host and renderer
        run: pnpm exec vitest run --config vitest.config.ts packages/plugin-host/tests packages/plugin-renderer/tests packages/plugin-inernal-nodes-host/tests packages/plugin-inernal-nodes-renderer/tests --maxWorkers=2
      - name: Test monorepo wiring
        run: pnpm run test:workspace
      - name: Test workflow scheduling
        run: pnpm exec vitest run --config vitest.config.ts tests/convax-ci-workflow.spec.ts tests/convax-i18n-workflow.spec.ts tests/workspace-resolution.client.spec.ts --maxWorkers=2
      - name: Install browser
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Test documentation in Chromium
        run: pnpm --filter @convax/docs test:browser
      - name: Prepare local process sandbox
        run: bash libs/dsh/scripts/prepare-ci-bubblewrap.sh
      - name: Test Convax internationalization in Chromium
        run: pnpm run test:i18n:e2e
      - name: Test canvas workflows in Chromium
        run: >-
          pnpm run test:web:built
          apps/web/tests/convax-canvas-directories.e2e.ts
          apps/web/tests/convax-canvas-manager.e2e.ts
          apps/web/tests/convax-canvas-interactions.e2e.ts
          apps/web/tests/convax-chat-settings.e2e.ts
          apps/web/tests/convax-window-mirror.e2e.ts
          apps/web/tests/convax-activity.e2e.ts
          apps/web/tests/convax-card-resize.e2e.ts
          apps/web/tests/convax-internal-nodes.e2e.ts

  windows:
    name: Native Windows canvas smoke
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test canvas layout and navigation
        run: >-
          pnpm exec vitest run --config vitest.config.ts
          packages/plugin-host/tests/layout.spec.ts
          packages/plugin-renderer/tests/placement.client.spec.ts
          packages/plugin-renderer/tests/store.client.spec.ts
          --maxWorkers=2
