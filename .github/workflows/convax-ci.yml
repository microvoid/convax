name: Convax CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convax-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  DSH_SNAPSHOT: replay
  DSH_GATE_CONCURRENCY: '2'
  DSH_OXLINT_THREADS: '2'

jobs:
  linux:
    name: Build, lint, and canvas behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build artifacts and check repository types
        run: pnpm run build
      - name: Lint
        run: pnpm run lint
      - name: Test canvas Host and renderer
        run: pnpm exec vitest run packages/convax/plugin-host/tests packages/convax/plugin-renderer/tests --maxWorkers=2
      - name: Test workflow scheduling
        run: pnpm exec vitest run scripts/convax-ci-workflow.spec.ts scripts/ci-workflow.spec.ts scripts/ci-compatible-selfhosted.spec.ts scripts/tests/ci-master-platforms.spec.ts scripts/preview-workflow.spec.ts --maxWorkers=2
      - name: Install browser
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Prepare local process sandbox
        run: bash scripts/prepare-ci-bubblewrap.sh
      - name: Test canvas workflows in Chromium
        run: >-
          pnpm run test:web:built
          apps/web/tests/convax-canvas-directories.e2e.ts
          apps/web/tests/convax-canvas-manager.e2e.ts
          apps/web/tests/convax-canvas-interactions.e2e.ts
          apps/web/tests/convax-chat-settings.e2e.ts
          apps/web/tests/convax-window-mirror.e2e.ts
          apps/web/tests/convax-activity.e2e.ts

  windows:
    name: Native Windows canvas smoke
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test canvas layout and navigation
        run: >-
          pnpm exec vitest run
          packages/convax/plugin-host/tests/layout.spec.ts
          packages/convax/plugin-renderer/tests/placement.client.spec.ts
          packages/convax/plugin-renderer/tests/store.client.spec.ts
          --maxWorkers=2
