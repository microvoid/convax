name: Convax Desktop Package
run-name: ${{ inputs.release_tag && format('Release Convax {0}', inputs.release_tag) || format('Build Convax desktop ({0})', inputs.signing) }}

on:
  workflow_dispatch:
    inputs:
      signing:
        description: macOS package signing mode
        type: choice
        options: [unsigned, signed]
        default: unsigned
        required: true
      release_tag:
        description: Version tag to release
        type: string
      release_sha:
        description: SHA from the tag push
        type: string

permissions:
  contents: read

concurrency:
  group: convax-desktop-package-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  DSH_DESKTOP_PRODUCT: convax
  DSH_TELEMETRY_DISABLED: '1'
  DSH_GATE_CONCURRENCY: '1'

jobs:
  macos-arm64:
    name: Apple Silicon macOS DMG (unsigned)
    if: inputs.signing == 'unsigned'
    runs-on: macos-15
    timeout-minutes: 90
    defaults: &bash-default
      run:
        shell: bash
    env:
      PACKAGE_MODE: unsigned
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - &setup-pnpm
        uses: pnpm/action-setup@v5.0.0
      - &setup-node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - &verify-runner
        name: Verify runner architecture
        run: |
          test "$(uname -m)" = arm64
          node -e 'if (process.platform !== "darwin" || process.arch !== "arm64") process.exit(1)'
          df -h "$GITHUB_WORKSPACE"
      - &install
        name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and smoke test the unsigned installer
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --dir libs/dsh/apps/desktop run package:mac:arm64:unsigned
      - &stage-installer
        name: Verify and stage the installer
        run: |
          shopt -s nullglob
          target_dir=libs/dsh/apps/desktop/.desktop-build/targets/mac-arm64
          case "$PACKAGE_MODE" in
            unsigned) installers=("$target_dir"/unsigned-artifacts/convax-*-mac-arm64-unsigned.dmg) ;;
            signed) installers=("$target_dir"/artifacts/convax-*-mac-arm64.dmg) ;;
            *) exit 1 ;;
          esac
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo "Expected exactly one Convax macOS arm64 installer, found ${#installers[@]}" >&2
            exit 1
          fi
          artifact_dir="$RUNNER_TEMP/convax-desktop-artifact"
          mkdir -p "$artifact_dir"
          hdiutil verify "${installers[0]}"
          if [[ "$PACKAGE_MODE" == signed ]]; then
            codesign --verify --strict "${installers[0]}"
            xcrun stapler validate "${installers[0]}"
            spctl --assess --type open --context context:primary-signature --verbose=2 "${installers[0]}"
          fi
          cp "${installers[0]}" "$artifact_dir/"
          cd "$artifact_dir"
          filename="$(basename "${installers[0]}")"
          shasum -a 256 "$filename" > "$filename.sha256"
      - &upload-installer
        name: Upload installer and checksum
        id: installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: convax-macos-arm64-${{ env.PACKAGE_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/convax-desktop-artifact/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - &upload-logs
        name: Upload packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: convax-macos-arm64-${{ env.PACKAGE_MODE }}-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: libs/dsh/apps/desktop/.desktop-build/packaging-runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  resolve-signed-source:
    name: Validate signed build source
    if: inputs.signing == 'signed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Verify tag and Convax version
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUSHED_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ -z "$RELEASE_TAG" && -z "$PUSHED_SHA" ]]; then
            printf 'commit=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          number='(0|[1-9][0-9]*)'
          identifiers='[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*'
          if [[ ! "$RELEASE_TAG" =~ ^v$number\.$number\.$number(-$identifiers)?(\+$identifiers)?$ ||
                ! "$PUSHED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a v-prefixed Convax version tag and the SHA from its push." >&2
            exit 1
          fi

          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          if [[ "$PUSHED_SHA" != "$commit" && "$PUSHED_SHA" != "$tag_object" ]]; then
            echo "Release tag moved after the push." >&2
            exit 1
          fi
          ancestry=$(gh api "repos/$GITHUB_REPOSITORY/compare/$commit...$GITHUB_SHA?per_page=1" --jq .status)
          if [[ "$ancestry" != ahead && "$ancestry" != identical ]]; then
            echo "Release tag must point to a commit on main." >&2
            exit 1
          fi

          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$commit" \
            --header 'Accept: application/vnd.github.raw+json' | jq --exit-status --raw-output .version)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag must match the Convax workspace version." >&2
            exit 1
          fi
          printf 'commit=%s\nversion=%s\n' "$commit" "$version" >> "$GITHUB_OUTPUT"

  macos-arm64-signed:
    name: Apple Silicon macOS DMG (signed and notarized)
    if: inputs.signing == 'signed' && github.ref == 'refs/heads/main'
    needs: resolve-signed-source
    environment: convax-macos-release
    outputs:
      artifact-id: ${{ steps.installer.outputs.artifact-id }}
    runs-on: macos-15
    timeout-minutes: 120
    defaults: *bash-default
    env:
      PACKAGE_MODE: signed
    steps:
      - name: Require signing credentials
        env: &signing-env
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD MACOS_SIGNING_IDENTITY MACOS_TEAM_ID \
            APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if [[ ${#missing[@]} -ne 0 ]]; then
            printf 'Missing signing secret %s\n' "${missing[@]}" >&2
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve-signed-source.outputs.commit }}
          persist-credentials: false
      - *setup-pnpm
      - *setup-node
      - *verify-runner
      - *install
      - name: Sign, notarize, and smoke test the installer
        env: *signing-env
        run: |
          signing_dir="$(umask 077; mktemp -d "$RUNNER_TEMP/convax-macos-signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          node --input-type=module - "$signing_dir" <<'NODE'
          import { writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { parseEnv } from 'node:util'

          const directory = process.argv[2]
          const required = (name) => {
            const value = process.env[name]
            if (!value?.trim()) throw new Error(`Missing signing secret ${name}`)
            return value
          }
          const materialize = (name, filename) => {
            const encoded = required(name).replace(/\s/gu, '')
            const bytes = Buffer.from(encoded, 'base64')
            if (!bytes.length || bytes.toString('base64') !== encoded) {
              throw new Error(`Signing secret ${name} must contain base64 data`)
            }
            const path = join(directory, filename)
            writeFileSync(path, bytes, { mode: 0o600 })
            return path
          }
          const settings = {
            DSH_DESKTOP_MACOS_SIGNING_IDENTITY: required('MACOS_SIGNING_IDENTITY'),
            DSH_DESKTOP_MACOS_TEAM_ID: required('MACOS_TEAM_ID'),
            CSC_LINK: materialize('MAC_CSC_LINK', 'certificate.p12'),
            CSC_KEY_PASSWORD: required('MAC_CSC_KEY_PASSWORD'),
            APPLE_API_KEY: materialize('APPLE_API_KEY', 'notary.p8'),
            APPLE_API_KEY_ID: required('APPLE_API_KEY_ID'),
            APPLE_API_ISSUER: required('APPLE_API_ISSUER'),
          }
          const lines = Object.entries(settings).map(([name, value]) => {
            if (/[\r\n\0]/u.test(value)) throw new Error(`Invalid multiline setting ${name}`)
            const line = ["'", '"', String.fromCharCode(96), '']
              .map(quote => `${name}=${quote}${value}${quote}`)
              .find(candidate => parseEnv(candidate)[name] === value)
            if (!line) throw new Error(`Could not write signing setting ${name}`)
            return line
          })
          writeFileSync(join(directory, 'signing.env'), lines.join('\n') + '\n', { mode: 0o600 })
          NODE
          unset MAC_CSC_LINK MAC_CSC_KEY_PASSWORD MACOS_SIGNING_IDENTITY MACOS_TEAM_ID
          unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          export DSH_DESKTOP_CONVAX_SIGNING_CONFIG="$signing_dir/signing.env"
          export NODE_OPTIONS=--max-old-space-size=4096
          pnpm --dir libs/dsh/apps/desktop run package:mac:arm64
      - *stage-installer
      - name: Verify a clean install opens and restores the canvas
        if: inputs.release_tag != ''
        env:
          RELEASE_VERSION: ${{ needs.resolve-signed-source.outputs.version }}
        run: node scripts/smoke-convax-macos-installer.mjs "$RUNNER_TEMP/convax-desktop-artifact/convax-$RELEASE_VERSION-mac-arm64.dmg" "$RELEASE_VERSION"
      - *upload-installer
      - *upload-logs

  publish-release:
    name: Publish the verified installer
    if: inputs.release_tag != ''
    needs: [resolve-signed-source, macos-arm64-signed]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.macos-arm64-signed.outputs.artifact-id }}
          path: ${{ runner.temp }}/convax-release
      - name: Publish DMG and SHA-256 to GitHub Releases
        shell: bash
        working-directory: ${{ runner.temp }}/convax-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve-signed-source.outputs.version }}
          RELEASE_COMMIT: ${{ needs.resolve-signed-source.outputs.commit }}
        run: |
          filename="convax-$RELEASE_VERSION-mac-arm64.dmg"
          checksum=$(sha256sum "$filename")
          if [[ "$(<"$filename.sha256")" != "$checksum" ]]; then
            echo "The downloaded installer does not match its SHA-256 file." >&2
            exit 1
          fi

          verify_tag() {
            local current_commit
            current_commit=$(gh api "repos/$GH_REPO/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)
            if [[ "$current_commit" != "$RELEASE_COMMIT" ]]; then
              echo "Release tag no longer points to the signed commit." >&2
              exit 1
            fi
          }

          verify_tag
          marker='<!-- convax-tag-release -->'
          expected=$(sha256sum "$filename" "$filename.sha256" | awk '{print $2 " sha256:" $1}' | sort)
          assets() {
            jq -r '.assets[] | select(.state == "uploaded") | .name + " " + .digest' | sort
          }

          if ! release=$(gh release view "$RELEASE_TAG" --json isDraft,body,assets); then
            options=()
            if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then
              options+=(--prerelease)
            fi
            # The existing tag pins the signed commit; targeting main avoids GitHub's workflow-write check.
            gh release create "$RELEASE_TAG" --verify-tag --target main --draft \
              --title "Convax $RELEASE_TAG" \
              --generate-notes --notes "$marker" "${options[@]}"
            release=$(gh release view "$RELEASE_TAG" --json isDraft,body,assets)
          fi

          actual=$(assets <<< "$release")
          if jq -e '.isDraft == false' <<< "$release" >/dev/null; then
            if [[ "$actual" == "$expected" ]]; then
              exit 0
            fi
            echo "The published release has different assets." >&2
            exit 1
          fi
          if ! jq -e --arg marker "$marker" '.body | startswith($marker)' <<< "$release" >/dev/null; then
            echo "A draft already exists outside the automated release workflow." >&2
            exit 1
          fi

          while read -r name digest; do
            if [[ -z "$name" ]]; then continue; fi
            if ! grep -Fqx "$name $digest" <<< "$expected"; then
              echo "The release draft has unexpected or different assets." >&2
              exit 1
            fi
          done <<< "$actual"
          for asset in "$filename" "$filename.sha256"; do
            if ! grep -Fq "$asset " <<< "$actual"; then
              upload_options=()
              if jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset and .state == "starter")' <<< "$release" >/dev/null; then
                upload_options+=(--clobber)
              fi
              gh release upload "$RELEASE_TAG" "$asset" "${upload_options[@]}"
            fi
          done
          release=$(gh release view "$RELEASE_TAG" --json assets)
          if [[ "$(assets <<< "$release")" != "$expected" ]]; then
            echo "GitHub release assets do not match the verified installer." >&2
            exit 1
          fi
          verify_tag
          gh release edit "$RELEASE_TAG" --verify-tag --draft=false

  reject-signed-ref:
    name: Reject signed packaging outside main
    if: inputs.signing == 'signed' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo "Signed packaging must be dispatched from main." >&2
          exit 1
