pre-commit:
  jobs:
    - name: translation pairing (staged records)
      glob: '*.i18n.yaml'
      exclude:
        - 'libs/dsh/.agents/notes/archived/**'
      run: node scripts/check-staged-translations.mjs {staged_files}
    - name: archived agent notes
      glob: 'libs/dsh/.agents/notes/archived/**'
      run: node_modules/.bin/tsx libs/dsh/scripts/verify-archived-agent-notes.ts
    - name: lint (staged)
      glob: '*.{ts,tsx,mts,cts,mjs}'
      exclude:
        - 'libs/dsh/vendor/*/src/**'
      run: node_modules/.bin/tsx libs/dsh/scripts/run-oxlint.ts --config libs/dsh/.oxlintrc.staged.json --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: whitespace (staged)
      run: git diff --cached --check
    - name: pi-ai provider metadata
      glob: '{pnpm-lock.yaml,libs/dsh/packages/llm/llm-pi-ai/package.json,libs/dsh/packages/llm/llm-pi-ai/scripts/gen-provider-data.ts,libs/dsh/packages/llm/llm-pi-ai/src/provider-data.generated.ts}'
      run: node_modules/.bin/tsx libs/dsh/packages/llm/llm-pi-ai/scripts/gen-provider-data.ts --check --cached
    - name: vendor manifest guard
      run: bash libs/dsh/scripts/check-vendor-manifest.sh
pre-merge-commit:
  jobs:
    - name: translation pairing (staged records)
      glob: '*.i18n.yaml'
      exclude:
        - 'libs/dsh/.agents/notes/archived/**'
      run: node scripts/check-staged-translations.mjs {staged_files}
    - name: archived agent notes
      glob: 'libs/dsh/.agents/notes/archived/**'
      run: node_modules/.bin/tsx libs/dsh/scripts/verify-archived-agent-notes.ts
pre-push:
  jobs:
    - name: typecheck
      run: pnpm run typecheck
